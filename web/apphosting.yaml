# Firebase App Hosting config for web/. The API key comes from Secret Manager.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_AGENT_URL
    value: https://supplier-carbon-agent-532444884362.asia-southeast1.run.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: fir-testing-f96b1
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: fir-testing-f96b1.firebaseapp.com
    availability: [BUILD, RUNTIME]
  # Shown on the sign-in page so people can find the email in spam. Matches Authentication > Templates > From.
  - variable: NEXT_PUBLIC_AUTH_EMAIL_SENDER
    value: noreply@siddhantxh.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: fir-testing-f96b1.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:532444884362:web:2528de737b30e08a052c73
    availability: [BUILD, RUNTIME]
